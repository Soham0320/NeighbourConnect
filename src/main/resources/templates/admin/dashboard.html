<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container section">
  <h1>Admin dashboard</h1>
  <p class="alert success" th:if="${success}" th:text="${success}"></p>

  <h2>Add item</h2>
  <form th:action="@{/admin/items}" th:object="${itemForm}" method="post" class="form">
    <label>Title <input type="text" th:field="*{title}"></label>
    <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
    <label>Description <textarea rows="3" th:field="*{description}"></textarea></label>
    <label>Price <input type="number" step="0.01" th:field="*{price}"></label>
    <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
    <label>Image URL <input type="text" th:field="*{imageUrl}"></label>
    <label>Category
      <select th:field="*{categoryId}">
        <option value="">None</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Category</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" th:field="*{featured}"> Featured</label>
    <button class="btn" type="submit">Create</button>
  </form>

  <h2>Items</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Title</th><th>Price</th><th>Category</th><th></th></tr></thead>
      <tbody>
        <tr th:each="i : ${items}">
          <td th:text="${i.title}">Title</td>
          <td th:text="${i.price}">0</td>
          <td th:text="${i.category != null} ? ${i.category.name} : '-'">-</td>
          <td>
            <form th:action="@{/admin/items/{id}/delete(id=${i.id})}" method="post" class="inline-form">
              <button type="submit" class="link-btn">Delete</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <h2>Contact messages</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Message</th><th>Status</th></tr></thead>
      <tbody>
        <tr th:each="m : ${messages}">
          <td th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy HH:mm')}">date</td>
          <td th:text="${m.name}">name</td>
          <td th:text="${m.email}">email</td>
          <td th:text="${m.message}">message</td>
          <td>
            <span th:if="${m.handled}">Handled</span>
            <form th:unless="${m.handled}" th:action="@{/admin/messages/{id}/handled(id=${m.id})}" method="post" class="inline-form">
              <button type="submit" class="link-btn">Mark handled</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
