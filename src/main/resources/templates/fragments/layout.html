<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Shared head/header/footer. When you get your Stitch designs, move the
     Stitch <head>, nav and footer markup into these fragments. -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | MySite'">MySite</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="header" class="site-header">
  <div class="container header-row">
    <a class="brand" th:href="@{/}">MySite</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-burger" aria-hidden="true">&#9776;</label>
    <nav class="nav">
      <a th:href="@{/}">Home</a>
      <a th:href="@{/items}">Items</a>
      <a th:href="@{/contact}">Contact</a>
      <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Admin</a>
      <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Login</a>
      <a th:href="@{/register}" sec:authorize="!isAuthenticated()">Register</a>
      <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="inline-form">
        <button type="submit" class="link-btn">Logout</button>
      </form>
    </nav>
  </div>
</header>
<footer th:fragment="footer" class="site-footer">
  <div class="container">&copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> MySite. All rights reserved.</div>
</footer>
</body>
</html>
