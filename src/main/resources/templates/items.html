<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Items')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container section">
  <h1>Items</h1>
  <form th:action="@{/items}" method="get" class="filters">
    <input type="search" name="q" th:value="${q}" placeholder="Search...">
    <select name="category">
      <option value="">All categories</option>
      <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
              th:selected="${selectedCategory != null and selectedCategory == c.id}">Category</option>
    </select>
    <button class="btn" type="submit">Search</button>
  </form>

  <p th:if="${page.empty}">No items found.</p>
  <div class="grid">
    <article class="card" th:each="item : ${page.content}">
      <img th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}" th:src="${item.imageUrl}" th:alt="${item.title}">
      <div class="card-body">
        <h3><a th:href="@{/items/{s}(s=${item.slug})}" th:text="${item.title}">Title</a></h3>
        <p th:text="${item.category != null} ? ${item.category.name} : ''">Category</p>
        <p class="price" th:text="${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}">0.00</p>
      </div>
    </article>
  </div>

  <nav class="pager" th:if="${page.totalPages > 1}">
    <a th:if="${page.hasPrevious()}" th:href="@{/items(q=${q},category=${selectedCategory},page=${page.number - 1})}">&laquo; Prev</a>
    <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
    <a th:if="${page.hasNext()}" th:href="@{/items(q=${q},category=${selectedCategory},page=${page.number + 1})}">Next &raquo;</a>
  </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
