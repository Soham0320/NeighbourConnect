<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container section narrow">
  <h1>Login</h1>
  <p class="alert error" th:if="${param.error}">Invalid email or password.</p>
  <p class="alert success" th:if="${registered}">Account created. Please log in.</p>
  <form th:action="@{/login}" method="post" class="form">
    <label>Email <input type="email" name="username" required autofocus></label>
    <label>Password <input type="password" name="password" required></label>
    <button class="btn" type="submit">Login</button>
  </form>
  <p>No account? <a th:href="@{/register}">Register</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
