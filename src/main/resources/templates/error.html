<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container section narrow">
  <h1 th:text="${status != null} ? ${status} : 'Oops'">Oops</h1>
  <p th:text="${message != null} ? ${message} : 'Something went wrong.'">Something went wrong.</p>
  <a class="btn" th:href="@{/}">Back to home</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
