<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
  <section class="hero">
    <div class="container">
      <h1>Welcome to MySite</h1>
      <p>Replace this hero with your Stitch design.</p>
      <a class="btn" th:href="@{/items}">Browse items</a>
    </div>
  </section>
  <section class="container section">
    <h2>Featured</h2>
    <div class="grid">
      <article class="card" th:each="item : ${featured}">
        <img th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}" th:src="${item.imageUrl}" th:alt="${item.title}">
        <div class="card-body">
          <h3><a th:href="@{/items/{s}(s=${item.slug})}" th:text="${item.title}">Title</a></h3>
          <p class="price" th:text="${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}">0.00</p>
        </div>
      </article>
    </div>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
