spring.application.name=website
server.port=8080

# Default: in-memory H2 (data resets on restart). Use the "prod" profile for MySQL.
spring.datasource.url=jdbc:h2:mem:websitedb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# Comma-separated origins allowed to call /api/**
app.cors.allowed-origins=http://localhost:3000

# Seeded admin account (CHANGE before going live)
app.admin.email=admin@example.com
app.admin.password=Admin@123
